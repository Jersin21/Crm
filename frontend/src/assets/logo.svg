<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mercadoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#1c2541" />
  <g filter="url(#shadow)">
    <!-- Techo del mercado con franjas -->
    <path d="M22 46 L60 22 L98 46 Z" fill="url(#mercadoGrad)" />
    <!-- Alero / toldo decorativo -->
    <path d="M20 46 L28 54 L36 46 L44 54 L52 46 L60 54 L68 46 L76 54 L84 46 L92 54 L100 46 L98 44 L22 44 Z" fill="#0ea5e9" opacity="0.9" />
    <!-- Columnas / Puestos -->
    <rect x="28" y="54" width="12" height="38" rx="2" fill="#38bdf8" />
    <rect x="44" y="54" width="32" height="38" rx="3" fill="#151d33" stroke="#2d3b60" stroke-width="2" />
    <!-- Puerta / Mostrador central -->
    <rect x="50" y="66" width="20" height="26" rx="2" fill="#0ea5e9" opacity="0.3" />
    <rect x="80" y="54" width="12" height="38" rx="2" fill="#38bdf8" />
    <!-- Base -->
    <rect x="20" y="92" width="80" height="8" rx="3" fill="url(#mercadoGrad)" />
  </g>
</svg>
